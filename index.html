<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мои подписки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Цвета: берём из темы Telegram, если её нет — свои светлые/тёмные */
  :root {
    --bg: #ffffff; --card: #f2f3f5; --text: #15171a; --muted: #6b7280; --line: #e3e5e8;
    --accent: #2f80ed; --accent-text: #ffffff; --warn: #c2410c; --good: #15803d; --danger: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-tg]) {
      --bg: #17181b; --card: #222428; --text: #eceef1; --muted: #9aa0a8; --line: #30333a;
      --accent: #5aa0ff; --accent-text: #0b1220; --warn: #fb923c; --good: #4ade80; --danger: #f87171;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding: 12px 16px 96px; max-width: 560px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 4px 0 12px; }
  h2 { font-size: 15px; margin: 18px 0 8px; color: var(--muted); font-weight: 600; }
  .tabs { display: flex; gap: 4px; background: var(--card); padding: 4px; border-radius: 12px; position: sticky; top: 0; z-index: 2; }
  .tabs button { flex: 1; border: 0; padding: 9px 2px; border-radius: 9px; background: transparent;
    color: var(--text); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-text); }
  .view { display: none; margin-top: 14px; }
  .view.active { display: block; }
  .muted { color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .banner { font-size: 13px; color: var(--muted); background: var(--card); border-radius: 10px; padding: 8px 12px; margin-bottom: 10px; }

  /* Календарь */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .cal-head b { font-size: 17px; }
  .nav { border: 0; background: var(--card); color: var(--text); width: 40px; height: 40px; border-radius: 10px; font-size: 18px; cursor: pointer; }
  .nav:disabled { opacity: .35; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .wd { text-align: center; font-size: 12px; color: var(--muted); padding: 4px 0; }
  .day { position: relative; aspect-ratio: 1 / 1; border: 0; border-radius: 10px; background: transparent;
    color: var(--text); font: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .day.out { visibility: hidden; }
  .day.past { color: var(--muted); }
  .day.today { box-shadow: inset 0 0 0 2px var(--accent); }
  .day.has { background: var(--card); font-weight: 600; }
  .day.sel { background: var(--accent); color: var(--accent-text); }
  .dots { display: flex; gap: 3px; height: 6px; margin-top: 3px; }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
  .day.sel .dot { background: var(--accent-text); }

  /* Списки */
  .item { display: flex; justify-content: space-between; gap: 12px; padding: 12px 14px; background: var(--card);
    border-radius: 12px; margin-bottom: 8px; width: 100%; border: 0; color: inherit; font: inherit; text-align: left; }
  button.item { cursor: pointer; }
  .item .name { font-weight: 600; }
  .item .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .item .right { text-align: right; white-space: nowrap; }
  .badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--bg); margin-top: 4px; }
  .badge.warn { color: var(--warn); }
  .badge.good { color: var(--good); }

  /* Расходы */
  .seg { display: inline-flex; background: var(--card); border-radius: 10px; padding: 3px; margin-bottom: 4px; }
  .seg button { border: 0; background: transparent; color: var(--text); font: inherit; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--bg); font-weight: 600; }
  .bar-row { padding: 8px 0; }
  .bar-top { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
  .bar-top .v { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .track { height: 10px; margin-top: 6px; }
  .fill { height: 10px; background: var(--accent); border-radius: 0 4px 4px 0; min-width: 3px; }
  .fill.free { background: var(--line); }
  .note { font-size: 13px; color: var(--muted); margin-top: 10px; }

  /* История */
  .pay { display: flex; justify-content: space-between; gap: 12px; padding: 10px 2px; border-bottom: 1px solid var(--line); }
  .pay:last-child { border-bottom: 0; }
  .pay .v { font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* Кнопки и шторка */
  .btn { display: block; width: 100%; border: 0; border-radius: 12px; padding: 13px 14px; font: inherit; font-weight: 600;
    background: var(--card); color: var(--text); cursor: pointer; text-align: center; margin-top: 8px; }
  .btn.primary { background: var(--accent); color: var(--accent-text); }
  .btn.danger { color: var(--danger); }
  [hidden] { display: none !important; }
  .fab { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom));
    width: min(528px, calc(100% - 32px)); z-index: 5; box-shadow: 0 4px 16px rgba(0,0,0,.18); margin: 0; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 10; display: none; align-items: flex-end; justify-content: center; }
  .overlay.open { display: flex; }
  .sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto;
    border-radius: 18px 18px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 6px; }
  .sheet-head b { font-size: 18px; }
  .close { border: 0; background: var(--card); color: var(--text); width: 34px; height: 34px; border-radius: 50%; font-size: 16px; cursor: pointer; flex: none; }
  .facts { background: var(--card); border-radius: 12px; padding: 4px 14px; margin: 10px 0; }
  .fact { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .fact:last-child { border-bottom: 0; }
  .fact span:last-child { text-align: right; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  label.f { display: block; margin-top: 12px; font-size: 13px; color: var(--muted); }
  .f input, .f select, .f textarea { display: block; width: 100%; margin-top: 4px; padding: 11px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; }
  .f textarea { resize: vertical; min-height: 64px; }
  .check { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; font-size: 14px; }
  .check input { width: 20px; height: 20px; margin: 0; flex: none; }
  .err { color: var(--danger); font-size: 14px; margin-top: 10px; min-height: 1em; }
</style>
</head>
<body>
  <h1>📋 Мои подписки</h1>
  <div class="tabs" role="tablist">
    <button role="tab" data-view="calendar" aria-selected="true">Календарь</button>
    <button role="tab" data-view="list" aria-selected="false">Подписки</button>
    <button role="tab" data-view="spend" aria-selected="false">Расходы</button>
    <button role="tab" data-view="history" aria-selected="false">История</button>
  </div>

  <section id="calendar" class="view active"></section>
  <section id="list" class="view"></section>
  <section id="spend" class="view"></section>
  <section id="history" class="view"></section>

  <button class="btn primary fab" id="fab" hidden>＋ Добавить подписку</button>
  <div class="overlay" id="overlay"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
(async function () {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready(); tg.expand();
    const p = tg.themeParams || {};
    const map = { bg_color: "--bg", secondary_bg_color: "--card", text_color: "--text",
                  hint_color: "--muted", button_color: "--accent", button_text_color: "--accent-text" };
    let used = false;
    for (const [k, v] of Object.entries(map)) if (p[k]) { document.documentElement.style.setProperty(v, p[k]); used = true; }
    if (used) document.documentElement.setAttribute("data-tg", "");
  }

  const CATS = { video: "🎬", music: "🎵", games: "🎮", cloud: "☁️", education: "📚", telecom: "📱", shopping: "🛒", other: "📦" };
  const CAT_NAMES = { video: "Кино и видео", music: "Музыка", games: "Игры", cloud: "Облако и софт", education: "Обучение",
                      telecom: "Связь и интернет", shopping: "Покупки и доставка", other: "Другое" };
  const CUR = { RUB: "₽", USD: "$", EUR: "€", AMD: "֏" };
  const PER = { 1: "мес", 3: "3 мес", 6: "полгода", 12: "год" };
  const PER_LONG = { 1: "Каждый месяц", 3: "Раз в 3 месяца", 6: "Раз в полгода", 12: "Раз в год" };
  // Популярные сервисы (как в боте): название -> категория
  const CATALOG = {"Кинопоиск":"video","Okko":"video","ivi":"video","Wink":"video","Кион":"video","Premier":"video","Start":"video","Амедиатека":"video","Netflix":"video","YouTube Premium":"video","Disney+":"video","Apple TV+":"video","Яндекс Музыка":"music","VK Музыка":"music","Звук":"music","Spotify":"music","Apple Music":"music","Яндекс Плюс":"other","СберПрайм":"other","МТС Premium":"other","Т-Банк Pro":"other","Telegram Premium":"other","iCloud+":"cloud","Google One":"cloud","Яндекс 360":"cloud","ChatGPT Plus":"cloud","Microsoft 365":"cloud","Adobe Creative Cloud":"cloud","Notion":"cloud","Dropbox":"cloud","PlayStation Plus":"games","Xbox Game Pass":"games","Nintendo Switch Online":"games","Skyeng":"education","Duolingo Super":"education","Coursera Plus":"education","Ozon Premium":"shopping","Самокат Плюс":"shopping","Купер":"shopping","Мобильная связь":"telecom","Домашний интернет":"telecom","VPN":"telecom"};
  const MAX_PRICE = 10000000, MAX_NOTE = 300;
  const MONTHS = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
  const MONTHS_GEN = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
  const WD = ["пн","вт","ср","чт","пт","сб","вс"];

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const money = (v, c) => {
    const r = Math.round(v * 100) / 100;
    const s = Number.isInteger(r) ? r.toLocaleString("ru-RU") : r.toLocaleString("ru-RU", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return s.replace(/ /g, " ") + " " + (CUR[c] || c);
  };
  const pd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const fmt = d => `${String(d.getDate()).padStart(2, "0")}.${String(d.getMonth() + 1).padStart(2, "0")}.${d.getFullYear()}`;
  const plural = (n, f) => (n % 10 === 1 && n % 100 !== 11) ? f[0] : ([2,3,4].includes(n % 10) && ![12,13,14].includes(n % 100)) ? f[1] : f[2];
  const daysLeft = n => n === 0 ? "сегодня" : n === 1 ? "завтра" : n < 0 ? "прошла" : `через ${n} ${plural(n, ["день","дня","дней"])}`;

  // ---------- Данные из ссылки: ?d=j.<base64url JSON> или ?d=z.<base64url deflate JSON> ----------
  function findPayload() {
    const parts = (location.search.slice(1) + "&" + location.hash.slice(1)).split(/[&#?]/);
    for (const part of parts) {
      if (part.startsWith("d=")) return decodeURIComponent(part.slice(2));
      if (/^[jz]\./.test(part)) return part;
    }
    return null;
  }
  async function decode(payload) {
    const kind = payload.slice(0, 2), b64 = payload.slice(2).replace(/-/g, "+").replace(/_/g, "/");
    const bytes = Uint8Array.from(atob(b64 + "===".slice((b64.length + 3) % 4)), c => c.charCodeAt(0));
    let raw = bytes;
    if (kind === "z.") {
      if (typeof DecompressionStream === "undefined") throw new Error("обнови Telegram — эта версия не умеет распаковывать данные");
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      raw = new Uint8Array(await new Response(stream).arrayBuffer());
    }
    return JSON.parse(new TextDecoder().decode(raw));
  }
  function showMessage(text) {
    for (const id of ["calendar", "list", "spend", "history"]) document.getElementById(id).innerHTML = `<div class="empty">${text}</div>`;
  }

  const payload = findPayload();
  if (!payload) { showMessage("Открой приложение кнопкой «📱 Приложение» в боте — так в нём появятся твои подписки."); return; }
  let data;
  try { data = await decode(payload); }
  catch (e) { showMessage("Не получилось прочитать данные: " + esc(e.message || e) + ".<br>Нажми «📱 Приложение» в боте ещё раз."); return; }

  const v2 = data.v >= 2;
  const today = pd(data.d);
  // v2: [id, название, категория, цена, валюта, месяцев, дата, конец пробного|0, на паузе с|0, заметка]
  // v1: [название, категория, цена, валюта, месяцев, дата, конец пробного|0, на паузе с|0]
  const subs = data.s.map(r => {
    const x = v2 ? r : [null, ...r, ""];
    return { id: x[0], name: x[1], cat: x[2], price: x[3], cur: x[4], months: x[5] || 1,
             pay: pd(x[6]), trial: x[7] ? pd(x[7]) : null, paused: x[8] ? pd(x[8]) : null, note: x[9] || "" };
  });
  const history = (data.h || []).map(r => ({ name: r[0], price: r[1], cur: r[2], paid: pd(r[3]) }));
  const active = subs.filter(s => !s.paused);
  const paused = subs.filter(s => s.paused);
  const trialNow = s => s.trial && today < s.trial;
  const byId = Object.fromEntries(subs.map(s => [s.id, s]));

  // Изменять можно, только если приложение открыто кнопкой внизу чата (тогда работает sendData)
  const canEdit = !!(v2 && tg && typeof tg.sendData === "function" && tg.platform !== "unknown"
                     && !(tg.initDataUnsafe && tg.initDataUnsafe.query_id));

  function addMonths(d, n, anchor) {
    const y = d.getFullYear(), m = d.getMonth() + n;
    const last = new Date(y, m + 1, 0).getDate();
    return new Date(y, m, Math.min(anchor, last));
  }
  function chargesIn(year, month) {
    const res = {};
    const end = new Date(year, month + 1, 0);
    for (const s of active) {
      let d = s.pay, i = 0;
      while (d <= end && i < 400) {
        if (d.getFullYear() === year && d.getMonth() === month) (res[d.getDate()] ||= []).push({ s, d });
        d = addMonths(s.pay, s.months * ++i, s.pay.getDate());
      }
    }
    return res;
  }

  // ---------- Календарь ----------
  const cal = document.getElementById("calendar");
  let cy = today.getFullYear(), cm = today.getMonth(), sel = null;
  const maxOffset = 11;
  const offset = () => (cy - today.getFullYear()) * 12 + cm - today.getMonth();

  function renderCalendar() {
    const charges = chargesIn(cy, cm);
    const first = new Date(cy, cm, 1), days = new Date(cy, cm + 1, 0).getDate();
    const lead = (first.getDay() + 6) % 7;
    if (sel === null || sel > days) {
      const upcoming = Object.keys(charges).map(Number).filter(d => new Date(cy, cm, d) >= today).sort((a, b) => a - b);
      sel = offset() === 0 ? (charges[today.getDate()] ? today.getDate() : (upcoming[0] || today.getDate())) : (upcoming[0] || 1);
    }
    let html = `<div class="cal-head">
      <button class="nav" id="prev" aria-label="Предыдущий месяц" ${offset() <= 0 ? "disabled" : ""}>‹</button>
      <b>${MONTHS[cm]} ${cy}</b>
      <button class="nav" id="next" aria-label="Следующий месяц" ${offset() >= maxOffset ? "disabled" : ""}>›</button></div>
      <div class="grid">${WD.map(w => `<div class="wd">${w}</div>`).join("")}`;
    for (let i = 0; i < lead; i++) html += `<div class="day out"></div>`;
    for (let d = 1; d <= days; d++) {
      const date = new Date(cy, cm, d), list = charges[d] || [];
      const cls = ["day", list.length && "has", d === sel && "sel", iso(date) === data.d && "today", date < today && "past"].filter(Boolean).join(" ");
      html += `<button class="${cls}" data-d="${d}" aria-label="${d} ${MONTHS[cm]}${list.length ? ", списаний: " + list.length : ""}">${d}
        <span class="dots">${list.slice(0, 3).map(() => '<span class="dot"></span>').join("")}</span></button>`;
    }
    html += `</div><h2>${sel} ${MONTHS_GEN[cm]}</h2>`;
    const list = charges[sel] || [];
    html += list.length ? list.map(({ s, d }) => itemHtml(s, d)).join("") : '<div class="muted">Списаний нет</div>';
    cal.innerHTML = html;
    cal.querySelector("#prev").onclick = () => { cm--; if (cm < 0) { cm = 11; cy--; } sel = null; renderCalendar(); };
    cal.querySelector("#next").onclick = () => { cm++; if (cm > 11) { cm = 0; cy++; } sel = null; renderCalendar(); };
    cal.querySelectorAll(".day[data-d]").forEach(b => b.onclick = () => { sel = +b.dataset.d; renderCalendar(); });
  }

  function itemHtml(s, d) {
    const n = Math.round((d - today) / 86400000);
    const freeNow = trialNow(s) && d < s.trial;
    const endsTrial = s.trial && iso(d) === iso(s.trial);
    const badge = freeNow ? '<span class="badge good">🎁 бесплатно</span>'
                : endsTrial ? '<span class="badge warn">конец пробного</span>'
                : n < 0 ? '<span class="badge warn">⚠️ дата прошла</span>'
                : `<span class="badge">${daysLeft(n)}</span>`;
    const tag = s.id != null ? "button" : "div";
    return `<${tag} class="item" ${s.id != null ? `data-id="${s.id}"` : ""}><div><div class="name">${CATS[s.cat] || "📦"} ${esc(s.name)}</div>
      <div class="sub">📅 ${fmt(d)}${s.note ? " · 📝" : ""}</div></div>
      <div class="right"><div>${money(s.price, s.cur)}</div><div class="sub">/ ${PER[s.months] || "мес"}</div>${badge}</div></${tag}>`;
  }

  // ---------- Список ----------
  function renderList() {
    const el = document.getElementById("list");
    let html = data.full === false ? '<div class="banner">Подписок много — показаны ближайшие.</div>' : "";
    if (!subs.length) {
      el.innerHTML = html + `<div class="empty">Подписок пока нет${canEdit ? "<br>Нажми «＋ Добавить подписку» внизу" : ""}</div>`;
      return;
    }
    const sorted = [...active].sort((a, b) => a.pay - b.pay);
    html += `<h2>Активные · ${active.length}</h2>` + (sorted.map(s => itemHtml(s, s.pay)).join("") || '<div class="muted">Нет активных подписок</div>');
    if (paused.length) {
      html += `<h2>⏸ На паузе · ${paused.length}</h2>` + paused.map(s => `<button class="item" data-id="${s.id}"><div>
        <div class="name">${CATS[s.cat] || "📦"} ${esc(s.name)}</div><div class="sub">на паузе с ${fmt(s.paused)}</div></div>
        <div class="right">${money(s.price, s.cur)}<div class="sub">/ ${PER[s.months] || "мес"}</div></div></button>`).join("");
    }
    el.innerHTML = html;
  }

  // ---------- Расходы: по сервисам, отдельно по каждой валюте ----------
  let perYear = false;
  function renderSpend() {
    const el = document.getElementById("spend");
    if (!active.length) { el.innerHTML = '<div class="empty">Нет активных подписок</div>'; return; }
    const k = perYear ? 12 : 1;
    let html = `<div class="seg" role="group" aria-label="Период">
      <button data-y="0" aria-pressed="${!perYear}">В месяц</button><button data-y="1" aria-pressed="${perYear}">В год</button></div>`;
    const byCur = {};
    for (const s of active) (byCur[s.cur] ||= []).push(s);
    for (const cur of Object.keys(CUR).filter(c => byCur[c]).concat(Object.keys(byCur).filter(c => !CUR[c]))) {
      const rows = byCur[cur].map(s => {
        let v = s.price / s.months * k;
        if (trialNow(s)) v = perYear && s.months === 1 ? v - s.price : (perYear ? v : 0);
        return { s, v };
      }).sort((a, b) => b.v - a.v);
      const max = Math.max(...rows.map(r => r.v), 1);
      html += `<h2>${perYear ? "Прогноз на год" : "Расходы в месяц"} · ${CUR[cur] || cur}</h2>`;
      html += rows.map(({ s, v }) => {
        const free = trialNow(s) && v === 0;
        const label = free ? "🎁 бесплатно" : money(v, cur);
        const hint = trialNow(s) ? (perYear && s.months === 1 ? " · 1-й месяц бесплатно" : " · пробный") : (!perYear && s.months !== 1 ? ` · ${money(s.price, cur)} / ${PER[s.months]}` : "");
        return `<div class="bar-row" title="${esc(s.name)}: ${label}">
          <div class="bar-top"><span>${CATS[s.cat] || "📦"} ${esc(s.name)}<span class="muted">${hint}</span></span><span class="v">${label}</span></div>
          <div class="track"><div class="fill ${free ? "free" : ""}" style="width:${free ? 3 : Math.max(2, v / max * 100)}%"></div></div></div>`;
      }).join("");
    }
    html += `<div class="note">Подписки в разных валютах показаны отдельно. Квартальные и годовые пересчитаны в месяц.</div>`;
    el.innerHTML = html;
    el.querySelectorAll(".seg button").forEach(b => b.onclick = () => { perYear = b.dataset.y === "1"; renderSpend(); });
  }

  // ---------- История оплат: по месяцам, каждая оплата отдельно ----------
  function renderHistory() {
    const el = document.getElementById("history");
    if (!v2) { el.innerHTML = '<div class="empty">Нажми «📱 Приложение» в боте ещё раз — история появится.</div>'; return; }
    if (!history.length) {
      el.innerHTML = '<div class="empty">Пока пусто.<br>Когда отмечаешь «✅ Я оплатил», оплата попадает сюда.</div>';
      return;
    }
    const groups = [];
    for (const p of history) {
      const key = p.paid.getFullYear() * 12 + p.paid.getMonth();
      if (!groups.length || groups[groups.length - 1].key !== key) groups.push({ key, d: p.paid, items: [] });
      groups[groups.length - 1].items.push(p);
    }
    el.innerHTML = groups.map(g => `<h2>${MONTHS[g.d.getMonth()]} ${g.d.getFullYear()} · ${g.items.length} ${plural(g.items.length, ["оплата","оплаты","оплат"])}</h2>
      <div class="facts">${g.items.map(p => `<div class="pay"><div><div>${esc(p.name)}</div><div class="muted" style="font-size:13px">${fmt(p.paid)}</div></div>
        <div class="v">${money(p.price, p.cur)}</div></div>`).join("")}</div>`).join("")
      + '<div class="note">Показаны оплаты за последний год. Вся история — в боте: /history.</div>';
  }

  // ---------- Шторка: карточка подписки и формы ----------
  const overlay = document.getElementById("overlay"), sheet = document.getElementById("sheet");
  function openSheet(html) {
    const wasOpen = overlay.classList.contains("open");
    sheet.innerHTML = html; overlay.classList.add("open"); sheet.scrollTop = 0;
    sheet.querySelector(".close").onclick = closeSheet;
    if (!wasOpen && tg && tg.BackButton) { tg.BackButton.show(); tg.BackButton.onClick(closeSheet); }
  }
  function closeSheet() {
    overlay.classList.remove("open"); sheet.innerHTML = "";
    if (tg && tg.BackButton) { tg.BackButton.offClick(closeSheet); tg.BackButton.hide(); }
  }
  overlay.addEventListener("click", e => { if (e.target === overlay) closeSheet(); });
  const head = title => `<div class="sheet-head"><b>${title}</b><button class="close" aria-label="Закрыть">✕</button></div>`;

  function confirmAsk(text, cb) {
    if (tg && tg.showConfirm && tg.isVersionAtLeast && tg.isVersionAtLeast("6.2")) tg.showConfirm(text, ok => ok && cb());
    else if (window.confirm(text)) cb();
  }
  function send(obj) {
    const json = JSON.stringify(obj);
    try { tg.sendData(json); }  // приложение закроется, ответ придёт в чат
    catch (e) { const er = sheet.querySelector(".err"); if (er) er.textContent = "Не получилось отправить: " + (e.message || e); }
  }

  function showSub(s) {
    const next = s.paused ? "—" : fmt(s.pay);
    const nextPay = addMonths(s.pay, s.months, s.pay.getDate());
    let html = head(`${CATS[s.cat] || "📦"} ${esc(s.name)}`) + `<div class="facts">
      <div class="fact"><span class="muted">Цена</span><span>${money(s.price, s.cur)} / ${PER[s.months] || "мес"}</span></div>
      <div class="fact"><span class="muted">Списание</span><span>${next}</span></div>
      ${trialNow(s) ? `<div class="fact"><span class="muted">Пробный период</span><span>🎁 до ${fmt(s.trial)}</span></div>` : ""}
      ${s.paused ? `<div class="fact"><span class="muted">Статус</span><span>⏸ на паузе с ${fmt(s.paused)}</span></div>` : ""}
      <div class="fact"><span class="muted">Категория</span><span>${CAT_NAMES[s.cat] || "Другое"}</span></div>
      ${s.note ? `<div class="fact"><span class="muted">📝</span><span>${esc(s.note)}</span></div>` : ""}</div>`;
    if (canEdit) {
      html += `<button class="btn primary" data-act="edit">✏️ Изменить</button>
        ${s.paused ? "" : `<button class="btn" data-act="paid">✅ Я оплатил</button>`}
        <button class="btn" data-act="${s.paused ? "resume" : "pause"}">${s.paused ? "▶️ Возобновить" : "⏸ На паузу"}</button>
        <button class="btn danger" data-act="del">🗑 Удалить</button><div class="err"></div>`;
    } else {
      html += '<div class="note">Чтобы изменить подписку, открой приложение кнопкой «📱 Приложение» в меню бота.</div>';
    }
    openSheet(html);
    sheet.querySelectorAll("[data-act]").forEach(b => b.onclick = () => {
      const a = b.dataset.act;
      if (a === "edit") return showForm(s);
      if (a === "paid") return confirmAsk(`Отметить оплату ${s.name}? Следующее списание — ${fmt(nextPay)}.`, () => send({ a: "paid", id: s.id }));
      if (a === "pause") return confirmAsk(`Поставить ${s.name} на паузу? Напоминаний не будет, пока не возобновишь.`, () => send({ a: "pause", id: s.id }));
      if (a === "resume") return send({ a: "resume", id: s.id });
      if (a === "del") return confirmAsk(`Удалить ${s.name}? Это нельзя отменить.`, () => send({ a: "del", id: s.id }));
    });
  }

  function options(obj, current) {
    return Object.entries(obj).map(([k, v]) => `<option value="${k}" ${String(k) === String(current) ? "selected" : ""}>${esc(v)}</option>`).join("");
  }

  function showForm(s) {
    const isNew = !s;
    const v = s || { name: "", cat: "other", price: "", cur: "RUB", months: 1, pay: null, note: "" };
    const catOpts = Object.fromEntries(Object.keys(CAT_NAMES).map(k => [k, `${CATS[k]} ${CAT_NAMES[k]}`]));
    const curOpts = { RUB: "₽ Рубль", USD: "$ Доллар", EUR: "€ Евро", AMD: "֏ Драм" };
    openSheet(head(isNew ? "Новая подписка" : "Изменить подписку") + `
      <label class="f">Сервис<input id="f-name" list="catalog" maxlength="100" autocomplete="off" placeholder="Например, Кинопоиск" value="${esc(v.name)}"></label>
      <datalist id="catalog">${Object.keys(CATALOG).map(n => `<option value="${esc(n)}">`).join("")}</datalist>
      <div class="row2">
        <label class="f">Цена<input id="f-price" inputmode="decimal" placeholder="299" value="${v.price === "" ? "" : v.price}"></label>
        <label class="f">Валюта<select id="f-cur">${options(curOpts, v.cur)}</select></label>
      </div>
      <div class="row2">
        <label class="f">Как часто<select id="f-months">${options(PER_LONG, v.months)}</select></label>
        <label class="f">${isNew ? "Списание" : "Следующее списание"}<input id="f-pay" type="date" min="${data.d}" value="${v.pay ? iso(v.pay) : ""}"></label>
      </div>
      <label class="f">Категория<select id="f-cat">${options(catOpts, v.cat)}</select></label>
      ${isNew ? `<label class="check"><input type="checkbox" id="f-trial"><span>Сейчас пробный период — дата выше будет первым платным списанием</span></label>` : ""}
      <label class="f">Заметка <span class="muted">— необязательно</span><textarea id="f-note" maxlength="${MAX_NOTE}" placeholder="Например: семейный тариф">${esc(v.note)}</textarea></label>
      <button class="btn primary" id="f-save">${isNew ? "Добавить" : "Сохранить"}</button>
      ${isNew ? "" : '<button class="btn" id="f-back">Назад</button>'}
      <div class="err" id="f-err"></div>`);

    const $ = id => sheet.querySelector("#" + id);
    // Выбрали сервис из списка — подставляем категорию
    $("f-name").addEventListener("change", () => { const c = CATALOG[$("f-name").value.trim()]; if (c) $("f-cat").value = c; });
    if (!isNew) $("f-back").onclick = () => showSub(s);
    $("f-save").onclick = () => {
      const err = msg => { $("f-err").textContent = msg; };
      const name = $("f-name").value.trim().replace(/\s+/g, " ");
      const price = Math.round(parseFloat($("f-price").value.replace(",", ".").replace(/\s/g, "")) * 100) / 100;
      const pay = $("f-pay").value;
      const note = $("f-note").value.trim();
      if (!name) return err("Укажи название сервиса");
      if (!(price > 0) || price > MAX_PRICE) return err("Цена должна быть больше нуля и не больше 10 000 000");
      const f = { name, price, cur: $("f-cur").value, months: +$("f-months").value, cat: $("f-cat").value, pay, note };

      if (isNew) {
        if (!pay) return err("Укажи дату списания");
        if (pay < data.d) return err("Эта дата уже прошла");
        return send({ a: "add", ...f, trial: $("f-trial").checked ? 1 : 0 });
      }
      // Изменение: отправляем только то, что поменялось
      const changes = {};
      if (name !== s.name) changes.name = name;
      if (price !== s.price) changes.price = price;
      if (f.cur !== s.cur) changes.cur = f.cur;
      if (f.months !== s.months) changes.months = f.months;
      if (f.cat !== s.cat) changes.cat = f.cat;
      if (note !== (s.note || "")) changes.note = note;
      if (pay !== iso(s.pay)) {
        if (!pay) return err("Укажи дату списания");
        if (pay < data.d) return err("Эта дата уже прошла");
        changes.pay = pay;
      }
      if (!Object.keys(changes).length) return err("Ничего не изменилось");
      send({ a: "edit", id: s.id, ...changes });
    };
  }

  // Нажатие на подписку в календаре или списке
  document.addEventListener("click", e => {
    const item = e.target.closest(".item[data-id]");
    if (item && byId[item.dataset.id]) showSub(byId[item.dataset.id]);
  });

  const fab = document.getElementById("fab");
  if (canEdit) { fab.hidden = false; fab.onclick = () => showForm(null); }
  else if (v2 && tg && tg.initDataUnsafe && tg.initDataUnsafe.query_id) {
    document.querySelector(".tabs").insertAdjacentHTML("beforebegin",
      '<div class="banner">Чтобы добавлять и менять подписки, открой приложение кнопкой «📱 Приложение» в меню бота.</div>');
  }

  // ---------- Вкладки ----------
  document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
    document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-selected", x === b));
    document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === b.dataset.view));
  });

  renderCalendar(); renderList(); renderSpend(); renderHistory();
})();
</script>
</body>
</html>
